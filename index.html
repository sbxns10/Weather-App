<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sumon's Weather App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1 class="header">🌤️ Sumon's Weather App</h1>
    
    <div class="search-box">
      <input type="text" placeholder="Enter city name..." id="city-input">
      <button id="search-btn">Search</button>
    </div>

    <div class="weather-card">
      <div id="weather-icon"></div>
      <div id="temperature" class="weather-info"></div>
      <div id="location" class="weather-info"></div>
      <div id="description" class="weather-info"></div>
      
      <div class="details">
        <div class="detail-item">
          <span>💧 Humidity</span>
          <span id="humidity"></span>
        </div>
        <div class="detail-item">
          <span>🌪️ Wind</span>
          <span id="wind-speed"></span>
        </div>
      </div>
    </div>

    <div id="error-message"></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
